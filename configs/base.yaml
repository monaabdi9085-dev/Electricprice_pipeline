# Core pipeline settings. Zones are a list; never hard-code one (D1).
zones: [SE3]            # rollout order: SE3, SE4, SE2, SE1
resolution: hourly      # hourly | PT15M (D2)
timezone: Europe/Stockholm
origin:
  local_time: "09:00"   # forecast origin on day D, predicting all hours of D+1 (D3)
quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
history_start: "2021-01-01"
seed: 42
paths:
  data_root: data       # local cache; canonical copy in object store (D8)
  raw: data/raw
  datasets: data/datasets
mlflow:
  tracking_uri: sqlite:///mlflow.db
  artifact_root: mlruns
compute_env: local-mac
