[project]
name = "pricefc"
version = "0.1.0"
description = "Swedish day-ahead electricity price forecasting, versioned with MLflow"
authors = [{ name = "johan", email = "johan@itkonsult.net" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "pyyaml>=6",
    "pydantic>=2.7",
    "typer>=0.12",
    "mlflow>=2.14",
    "requests>=2.32",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "pandera>=0.33.1",
    "entsoe-py>=0.8.1",
]

[project.optional-dependencies]
local-mac = []
gpu-cuda = []

[project.scripts]
pricefc = "pricefc.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
    "types-requests",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = ["live: calls real external APIs; run with `make test-live`"]
